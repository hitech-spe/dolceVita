<button
        class="back-to-top"
        [class.visible]="showBackToTop"
        (click)="scrollToTop()"
        aria-label="Torna in cima"
>
    <i class="fa-solid fa-chevron-up"></i>
</button>

<section id="home" class="hero">
    @for (img of backgroundImages; track $index) {
        <div class="hero-bg-wrapper" [class.active]="currentImageIndex === $index">
            <img
                    [ngSrc]="img"
                    fill
                    [priority]="$index === 0"
                    alt="Sfondo della hero section"
                    style="object-fit: cover;"
            >
        </div>
    }

    <div class="hero-overlay"></div>

    <div class="hero-container">
        <div class="hero-content fade-in">
            <h1>{{ 'HOME.HERO.TITLE' | translate }}</h1>
            <p class="hero-subtitle">{{ 'HOME.HERO.SUBTITLE' | translate }}</p>

            <div class="cta">
                <a [routerLink]="['/home']" fragment="services" class="btn btn-accent">
                    {{ 'HOME.HERO.CTA_SERVICES' | translate }}
                </a>
                <a [routerLink]="['/contact']" class="btn btn-outline-white">
                    {{ 'HOME.HERO.CTA_CONTACT' | translate }}
                </a>
            </div>
        </div>
    </div>
</section>

<app-about></app-about>

<app-services></app-services>

<app-rental-promo></app-rental-promo>

<app-testimonials></app-testimonials>

<router-outlet></router-outlet>
