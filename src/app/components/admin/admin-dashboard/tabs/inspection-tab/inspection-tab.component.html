<div class="panel">
    <div class="panel-header">
        <h2>Revisioni Veicoli</h2>
        <div class="panel-actions">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" [(ngModel)]="searchTerm" placeholder="Cerca per targa...">
            </div>
            <select [(ngModel)]="sortBy" class="sort-select">
                <option value="expiryDate">Ordina per Scadenza</option>
                <option value="vehiclePlate">Ordina per Targa</option>
            </select>
            <button class="btn btn-accent" (click)="openModal()">+ Aggiungi</button>
        </div>
    </div>
    <div class="table-responsive shadow-sm">
        <table class="modern-table">
            <thead>
                <tr>
                    <th>Veicolo</th>
                    <th>Prossima Scadenza</th>
                    <th>Note</th>
                </tr>
            </thead>
            <tbody>
                @for (insp of getFiltered(inspections$ | async); track insp.id) {
                    <tr>
                        <td class="fw-bold">{{ insp.vehiclePlate }}</td>
                        <td>{{ formatDate(insp.expiryDate) }}</td>
                        <td>{{ insp.notes }}</td>
                    </tr>
                } @empty {
                    <tr><td colspan="3" class="text-center py-4">Nessuna revisione trovata.</td></tr>
                }
            </tbody>
        </table>
    </div>
</div>

@if (isModalOpen) {
    <div class="modal-overlay">
        <div class="modal-card">
            <h3>Nuova Revisione</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Veicolo</label>
                    <select [(ngModel)]="newInspection.vehicleId">
                        <option value="" disabled selected>Seleziona veicolo...</option>
                        @for (v of availableVehicles; track v.id) {
                            <option [value]="v.id">{{ v.brand }} {{ v.model }} ({{ v.plate }})</option>
                        }
                    </select>
                </div>
                <div class="form-group"><label>Scadenza Revisione</label><input type="date" [(ngModel)]="newInspection.expiryDate"></div>
                <div class="form-group"><label>Note</label><input type="text" [(ngModel)]="newInspection.notes"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" (click)="closeModal()">Annulla</button>
                <button class="btn btn-accent" (click)="saveInspection()">Salva</button>
            </div>
        </div>
    </div>
}
